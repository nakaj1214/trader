name: Forward Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/evaluation/forward_validation.py"
      - "scripts/rebuild_forward_validation.py"
      - "tests/test_forward_validation.py"
      - ".github/workflows/forward_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests/test_forward_validation.py -q --override-ini="addopts="

      - name: Rebuild committed predictions and validate against market prices
        run: python scripts/rebuild_forward_validation.py --since 2026-02-18

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: forward-validation-report
          path: |
            artifacts/forward_validation.json
            artifacts/forward_validation_summary.json
          retention-days: 30
