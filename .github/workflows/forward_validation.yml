name: Forward Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/evaluation/exit_rules.py"
      - "src/evaluation/explosion.py"
      - "src/evaluation/regime.py"
      - "src/evaluation/inflection_backtest.py"
      - "src/evaluation/inflection_forward.py"
      - "src/evaluation/inflection_portfolio.py"
      - "src/evaluation/inflection_recall.py"
      - "src/evaluation/inflection_learning.py"
      - "src/data/forward_prices.py"
      - "src/data/live_quote.py"
      - "src/data/session_gaps.py"
      - "src/data/snapshot_crypto.py"
      - "src/strategy/**"
      - "scripts/rebuild_inflection_forward_validation.py"
      - "scripts/rebuild_inflection_learning.py"
      - "dashboard/data/inflection/**"
      - "tests/test_exit_rules.py"
      - "tests/test_explosion.py"
      - "tests/test_regime.py"
      - "tests/test_session_gaps.py"
      - "tests/test_forward_prices.py"
      - "tests/test_snapshot_crypto.py"
      - "tests/test_inflection_strategy.py"
      - "tests/test_inflection_backtest.py"
      - "tests/test_inflection_forward.py"
      - "tests/test_inflection_portfolio.py"
      - "tests/test_inflection_recall.py"
      - "tests/test_inflection_learning.py"
      - "tests/test_live_quote.py"
      - ".github/workflows/forward_validation.yml"
  schedule:
    # Sunday 09:30 JST (00:30 UTC).
    - cron: '30 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      failure_stage: ${{ steps.checkout.outcome == 'failure' && 'checkout' || steps.install.outcome == 'failure' && 'install' || 'forward' }}
      price_hashes_created: ${{ steps.forward_validation.outputs.price_hashes_created }}

    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test forward-validation core
        id: test
        run: |
          python -m pytest \
            tests/test_exit_rules.py \
            tests/test_explosion.py \
            tests/test_regime.py \
            tests/test_session_gaps.py \
            tests/test_forward_prices.py \
            tests/test_snapshot_crypto.py \
            tests/test_inflection_strategy.py \
            tests/test_inflection_backtest.py \
            tests/test_inflection_forward.py \
            tests/test_inflection_portfolio.py \
            tests/test_inflection_recall.py \
            tests/test_inflection_learning.py \
            --cov=src.data.forward_prices \
            --cov=src.data.session_gaps \
            --cov=src.evaluation.exit_rules \
            --cov=src.evaluation.explosion \
            --cov=src.evaluation.regime \
            --cov=src.evaluation.inflection_backtest \
            --cov=src.evaluation.inflection_forward \
            --cov=src.evaluation.inflection_portfolio \
            --cov=src.evaluation.inflection_recall \
            --cov=src.evaluation.inflection_learning \
            --cov=src.data.snapshot_crypto \
            --cov=src.strategy.inflection \
            --cov-fail-under=80 \
            -q --override-ini="addopts="

      - name: Validate accumulated encrypted snapshots
        id: forward_validation
        env:
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
        run: |
          python scripts/rebuild_inflection_forward_validation.py
          if [[ -f dashboard/data/inflection_forward_price_hashes.enc ]]; then
            echo "price_hashes_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "price_hashes_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pass encrypted price hashes to persistence job
        id: upload-price-hashes
        if: steps.forward_validation.outputs.price_hashes_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: inflection-forward-price-hashes
          path: dashboard/data/inflection_forward_price_hashes.enc
          retention-days: 90

      - name: Preserve aggregate validation summary
        id: upload-validation-summary
        uses: actions/upload-artifact@v7
        with:
          name: inflection-forward-summary
          path: artifacts/inflection_forward_validation_summary.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Build inflection learning report
        id: learning
        if: github.event_name == 'schedule'
        env:
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
        run: python scripts/rebuild_inflection_learning.py --promotion-strategy-version jp-inflection-shadow-v3

      - name: Preserve aggregate learning summary
        id: upload-learning-summary
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: inflection-learning-summary
          path: artifacts/inflection_learning_summary.json
          if-no-files-found: ignore
          retention-days: 90

      # Prediction-level trade rows remain on the ephemeral runner.

  persist-price-hashes:
    needs: validate
    if: github.event_name == 'schedule' && needs.validate.outputs.price_hashes_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      failure_stage: ${{ steps.checkout.outcome == 'failure' && 'checkout' || steps.git_push.outcome == 'failure' && 'git_push' || 'forward' }}

    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: download-price-hashes
        uses: actions/download-artifact@v7
        with:
          name: inflection-forward-price-hashes
          path: dashboard/data

      # Intentional direct push: this job writes one encrypted generated-data file only.
      - name: Commit encrypted forward-price hashes
        id: git_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/inflection_forward_price_hashes.enc
          git diff --staged --quiet || git commit -m "data: update encrypted forward-price hashes [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push

  notify-failure:
    needs: [validate, persist-price-hashes]
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.validate.result == 'failure' || needs.validate.result == 'cancelled' || needs.persist-price-hashes.result == 'failure' || needs.persist-price-hashes.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    concurrency:
      group: workflow-reliability-notifications
      cancel-in-progress: false
    steps:
      - name: Checkout trusted notifier
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Restore notification state
        id: restore-alert-state
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .harness/state/workflow-alerts.json
          key: workflow-reliability-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            workflow-reliability-main-

      - name: Notify classified workflow failure
        id: notify
        env:
          FAILURE_STAGE: ${{ (needs.validate.result == 'failure' || needs.validate.result == 'cancelled') && needs.validate.outputs.failure_stage || needs.persist-price-hashes.outputs.failure_stage || 'forward' }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: forward_validation.yml
        run: python scripts/check_workflow_health.py --notify-failure

      - name: Save notification state
        if: steps.notify.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .harness/state/workflow-alerts.json
          key: workflow-reliability-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
