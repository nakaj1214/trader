name: JP Inflection Shadow Scan

on:
  schedule:
    # 16:40 JST (07:40 UTC), Monday-Friday.
    - cron: '40 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: jp-inflection-shadow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run JP inflection shadow scan
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python scripts/run_inflection_shadow.py

      - name: Commit immutable daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/inflection/ dashboard/data/inflection_candidates.json
          git diff --staged --quiet || git commit -m "data: record JP inflection shadow scan [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push

      - name: Notify Slack on failure only
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"JP Inflection Shadow Scan FAILED\nref=${{ github.ref_name }}\nrun=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${SLACK_WEBHOOK_URL}"
