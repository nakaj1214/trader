name: JP Inflection Shadow Scan

on:
  schedule:
    # 16:40 JST (07:40 UTC), Monday-Friday.
    - cron: '40 7 * * 1-5'
  workflow_dispatch:
    inputs:
      resend_digest:
        description: Resend today's digest even if already marked succeeded
        type: boolean
        default: false

concurrency:
  # A manual branch run must never cancel the scheduled main run.
  group: jp-inflection-shadow-${{ github.ref_name }}
  # A manual run on main queues behind the scheduled run instead of cancelling it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      failure_stage: ${{ steps.checkout.outcome == 'failure' && 'checkout' || steps.setup.outcome == 'failure' && 'setup' || steps.install.outcome == 'failure' && 'install' || steps.scan.outputs.failure_stage || steps.persist.outcome == 'failure' && 'git_push' || 'data_acquisition' }}
      retry_exhausted: ${{ steps.scan.outputs.retry_exhausted }}
      expected_date: ${{ steps.scan.outputs.expected_date }}
      universe: ${{ steps.scan.outputs.universe }}
      missing: ${{ steps.scan.outputs.missing }}
      price_data: ${{ steps.scan.outputs.price_data }}
      price_coverage: ${{ steps.scan.outputs.price_coverage }}
      latest_coverage: ${{ steps.scan.outputs.latest_coverage }}
      latest_dates: ${{ steps.scan.outputs.latest_dates }}
      dropped_future_bars: ${{ steps.scan.outputs.dropped_future_bars }}
      failed_gate: ${{ steps.scan.outputs.failed_gate }}
      attempts: ${{ steps.scan.outputs.attempts }}

    env:
      JQUANTS_PLAN: free
      JQUANTS_DATA_DELAY_WEEKS: '12'

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime dependencies
        id: install
        run: |
          python -m pip install uv==0.9.21
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run JP inflection shadow scan
        id: scan
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
          RESEND_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_digest || false }}
        run: python scripts/run_inflection_shadow.py

      # Intentional direct push: this step writes encrypted generated data only, never source code.
      - name: Commit encrypted immutable market-day snapshot
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/inflection/ dashboard/data/inflection_candidates.enc
          git diff --staged --quiet || git commit -m "data: record encrypted JP inflection shadow scan [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push


  notify-failure:
    needs: scan
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.scan.result == 'failure' || needs.scan.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    concurrency:
      group: workflow-reliability-notifications
      cancel-in-progress: false
    steps:
      - name: Checkout trusted notifier
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          ref: main
          persist-credentials: false

      - name: Restore notification state
        id: restore-alert-state
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/restore v4
        with:
          path: .harness/state/workflow-alerts.json
          key: workflow-reliability-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: |
            workflow-reliability-main-

      - name: Notify classified workflow failure
        id: notify
        env:
          FAILURE_STAGE: ${{ needs.scan.outputs.failure_stage || 'data_acquisition' }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RETRY_DETAILS_JSON: ${{ toJSON(needs.scan.outputs) }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: inflection_shadow.yml
        run: python scripts/check_workflow_health.py --notify-failure

      - name: Save notification state
        if: steps.notify.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache/save v4
        with:
          path: .harness/state/workflow-alerts.json
          key: workflow-reliability-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
