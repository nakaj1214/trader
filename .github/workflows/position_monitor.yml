name: Position Exit Monitor

on:
  schedule:
    # 09:03, 12:35 and 15:35 JST, Monday-Friday. Scheduled runs are best-effort.
    - cron: '3 0 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: position-monitor-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Monitor manual positions
        run: python scripts/run_position_monitor.py

      - name: Notify failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl --fail-with-body --max-time 10 -X POST -H 'Content-type: application/json' \
            --data '{"text":"Position Exit Monitor workflow failed. Check GitHub Actions logs."}' \
            "${SLACK_WEBHOOK_URL}"
