name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"

# Lint, type-check and tests need nothing beyond reading the repository (also for fork pull requests).
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.21
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check src scripts tests

      - name: Type-check production path
        run: |
          mypy --ignore-missing-imports \
            src/data/forward_prices.py \
            src/data/jquants_history.py \
            src/data/jquants_v2_client.py \
            src/data/edinet.py \
            src/data/yfinance_prices.py \
            src/data/live_quote.py \
            src/data/sheets_client.py \
            src/data/snapshot_crypto.py \
            src/data/market_calendar.py \
            src/data/session_gaps.py \
            src/data/validation.py \
            src/evaluation/exit_rules.py \
            src/evaluation/explosion.py \
            src/evaluation/inflection_backtest.py \
            src/evaluation/inflection_event_recall.py \
            src/evaluation/inflection_forward.py \
            src/evaluation/inflection_historical.py \
            src/evaluation/inflection_learning.py \
            src/evaluation/inflection_portfolio.py \
            src/evaluation/inflection_recall.py \
            src/evaluation/inflection_report.py \
            src/evaluation/regime.py \
            src/monitoring/position_exit.py \
            src/notify/inflection_digest.py \
            src/notify/slack.py \
            src/screening/inflection_live.py \
            scripts/rebuild_inflection_forward_validation.py \
            scripts/rebuild_inflection_learning.py \
            scripts/run_inflection_historical_backtest.py \
            scripts/run_edinet_fetch.py \
            scripts/run_inflection_shadow.py \
            scripts/run_position_monitor.py \
            scripts/show_candidates.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.21
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run regression suite with coverage
        run: python -m pytest tests/ -q
