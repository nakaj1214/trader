name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "config/**"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint production trading core
        run: |
          ruff check \
            src/evaluation/forward_validation.py \
            src/evaluation/benchmark.py \
            src/evaluation/inflection_backtest.py \
            src/evaluation/inflection_forward.py \
            src/data/validation.py \
            src/data/point_in_time.py \
            src/data/providers/edinet_provider.py \
            src/data/jquants_v2_client.py \
            src/data/yfinance_prices.py \
            src/data/snapshot_crypto.py \
            src/data/market_calendar.py \
            src/screening/inflection_live.py \
            src/strategy/inflection.py \
            scripts/rebuild_forward_validation.py \
            scripts/rebuild_inflection_forward_validation.py \
            scripts/run_inflection_shadow.py \
            tests/test_forward_validation.py \
            tests/test_benchmark.py \
            tests/test_data_validation.py \
            tests/test_point_in_time.py \
            tests/test_edinet_provider.py \
            tests/test_jquants_v2_client.py \
            tests/test_yfinance_prices.py \
            tests/test_snapshot_crypto.py \
            tests/test_inflection_strategy.py \
            tests/test_inflection_backtest.py \
            tests/test_inflection_forward.py \
            tests/test_inflection_live.py \
            tests/test_shadow_health.py

      - name: Type-check production inflection path
        run: |
          mypy --ignore-missing-imports \
            src/data/jquants_v2_client.py \
            src/data/yfinance_prices.py \
            src/data/snapshot_crypto.py \
            src/data/market_calendar.py \
            src/evaluation/inflection_forward.py \
            src/screening/inflection_live.py \
            scripts/run_inflection_shadow.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full regression suite
        run: python -m pytest tests/ -q --override-ini="addopts="

      - name: Enforce production-core coverage threshold
        run: |
          python -m pytest \
            tests/test_forward_validation.py \
            tests/test_benchmark.py \
            tests/test_data_validation.py \
            tests/test_point_in_time.py \
            tests/test_edinet_provider.py \
            tests/test_jquants_v2_client.py \
            tests/test_yfinance_prices.py \
            tests/test_snapshot_crypto.py \
            tests/test_inflection_strategy.py \
            tests/test_inflection_backtest.py \
            tests/test_inflection_forward.py \
            tests/test_inflection_live.py \
            tests/test_shadow_health.py \
            --cov=src.evaluation.forward_validation \
            --cov=src.evaluation.benchmark \
            --cov=src.evaluation.inflection_backtest \
            --cov=src.evaluation.inflection_forward \
            --cov=src.data.validation \
            --cov=src.data.point_in_time \
            --cov=src.data.providers.edinet_provider \
            --cov=src.data.jquants_v2_client \
            --cov=src.data.yfinance_prices \
            --cov=src.data.snapshot_crypto \
            --cov=src.data.market_calendar \
            --cov=src.screening.inflection_live \
            --cov=src.strategy.inflection \
            --cov=scripts.run_inflection_shadow \
            --cov-fail-under=80 \
            -q --override-ini="addopts="
