[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "2.0.0"
description = "Automated trading analysis and signal system"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.7.0",
    "pandas==3.0.5",
    "exchange-calendars==4.13.2",
    "ta==0.11.0",
    "matplotlib==3.11.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "gspread==6.2.1",
    "google-auth==2.57.1",
    "requests==2.34.2",
    "cryptography==50.0.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "typer==0.27.2",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "cachetools==7.1.8",
    "anthropic==0.125.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0,<2.0",
]
ml = [
    "prophet>=1.1.5",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.6",
    "black==26.5.1",
    "isort==9.0.1",
    "pre-commit==4.6.2",
]

[project.scripts]
trader = "src.cli:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-fail-under=80"

[tool.isort]
profile = "black"
