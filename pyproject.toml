[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "2.0.0"
description = "Japanese stock inflection shadow scanner and forward-validation system"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.7.0",
    "pandas==3.0.5",
    "exchange-calendars==4.13.2",
    "requests==2.34.2",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["archive*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-fail-under=80"
